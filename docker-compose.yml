services:
  lfm-server:
    build: .
    container_name: lingua-franca-messenger
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./certs:/app/certs
    environment:
      - LFM_DS_ADDR=:1863
      - LFM_NS_ADDR=:1864
      - LFM_SB_ADDR=:1865
    env_file:
      - .env
